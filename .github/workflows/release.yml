name: Release Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image_name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ${{ steps.image_name.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image_name.outputs.name }}:latest
          outputs: |
            type=registry
            type=docker,dest=/tmp/ai-code-tracker-server-${{ github.ref_name }}-linux-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ai-code-tracker-server-${{ github.ref_name }}-linux-amd64
          path: /tmp/ai-code-tracker-server-${{ github.ref_name }}-linux-amd64.tar
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: /tmp/ai-code-tracker-server-${{ github.ref_name }}-linux-amd64.tar
